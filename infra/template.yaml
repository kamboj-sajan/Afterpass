AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >-
  AfterPass (brief section 11): published data on S3 behind CloudFront, the agent, the alerts
  and the live pipeline. Everything is on demand; nothing runs when nobody is using it.

Parameters:
  PipelineImage:
    Type: String
    Description: The pipeline image, by digest, as `make image` builds it (infra/build.yaml).
  AlertEmail:
    Type: String
    Description: Where pipeline failure emails go (passed at deploy time; not kept in the repository).

Resources:
  # --- Storage and delivery (11.1) ---------------------------------------------------------

  DataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          # Old versions of republished files, and cached downloads, are not kept for long.
          - Id: expire-old-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 14
          - Id: expire-pipeline-cache
            Status: Enabled
            Prefix: cache/s2/
            ExpirationInDays: 45

  DataOriginAccess:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-data
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # JSON changes when the pipeline runs: five minutes. Imagery never changes once made: a day.
  DataCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub ${AWS::StackName}-json-5min
        DefaultTTL: 300
        MinTTL: 0
        MaxTTL: 300
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  ImageryCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub ${AWS::StackName}-imagery-1day
        DefaultTTL: 86400
        MinTTL: 0
        MaxTTL: 86400
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  DataCors:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub ${AWS::StackName}-cors
        CorsConfig:
          AccessControlAllowCredentials: false
          AccessControlAllowHeaders:
            Items: ['*']
          AccessControlAllowMethods:
            Items: [GET, HEAD]
          AccessControlAllowOrigins:
            # The app's own address, and the local dev and preview servers.
            Items:
              - !Sub https://main.${WebApp.DefaultDomain}
              - http://localhost:5173
              - http://127.0.0.1:5173
              - http://127.0.0.1:4173
          AccessControlMaxAgeSec: 86400
          OriginOverride: true

  DataDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: AfterPass published data (public/ prefix of the data bucket)
        HttpVersion: http2and3
        # Includes the edge locations in India.
        PriceClass: PriceClass_200
        Origins:
          - Id: data
            DomainName: !GetAtt DataBucket.RegionalDomainName
            OriginPath: /public
            OriginAccessControlId: !GetAtt DataOriginAccess.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: data
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          Compress: true
          CachePolicyId: !Ref DataCachePolicy
          ResponseHeadersPolicyId: !Ref DataCors
        CacheBehaviors:
          - PathPattern: imagery/*
            TargetOriginId: data
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD, OPTIONS]
            Compress: true
            CachePolicyId: !Ref ImageryCachePolicy
            ResponseHeadersPolicyId: !Ref DataCors

  DataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DataBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CloudFrontReadsPublicPrefix
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${DataBucket.Arn}/public/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${DataDistribution}

  # --- Tables (11.5) -----------------------------------------------------------------------

  StatsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: afterpass-stats
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  RateLimitTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: afterpass-ratelimit
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires
        Enabled: true

  # --- Agent (11.7) -----------------------------------------------------------------------

  AgentFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      Description: Ask AfterPass - answers from the published data and returns map actions
      CodeUri: ../backend
      Handler: agent.handler.lambda_handler
      Runtime: python3.12
      Architectures: [arm64]
      MemorySize: 512
      Timeout: 60
      # The account allows 10 concurrent executions in all, so none can be reserved for this
      # function; that account limit is what caps a burst of questions.
      Environment:
        Variables:
          AFTERPASS_DATA: !Sub https://${DataDistribution.DomainName}
          AGENT_MODEL: mantle:openai.gpt-oss-120b
          RATE_LIMIT_TABLE: !Ref RateLimitTable
          RATE_LIMIT_SALT: !Ref AWS::StackId
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - !Sub https://main.${WebApp.DefaultDomain}
            - http://localhost:5173
            - http://127.0.0.1:5173
            - http://127.0.0.1:4173
          AllowMethods: [POST]
          AllowHeaders: [content-type]
          MaxAge: 86400
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Sid: AskTheModel
              Effect: Allow
              Action:
                # The agent signs a short-lived bearer token with this role and calls
                # Bedrock's OpenAI-compatible endpoint with it.
                - bedrock-mantle:CreateInference
                - bedrock-mantle:CallWithBearerToken
              Resource: '*'
            - Sid: CountQuestions
              Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt RateLimitTable.Arn

  AgentLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AgentFunction}
      RetentionInDays: 14

  # --- Frontend hosting and maps (11.9, 11.10) -------------------------------------------

  # No repository is connected: `make deploy-web` uploads the built frontend.
  WebApp:
    Type: AWS::Amplify::App
    Properties:
      Name: afterpass
      Platform: WEB
      CustomRules:
        # A single-page app: any path that is not a file is served by index.html.
        - Source: </^[^.]+$|\.(?!(css|gif|ico|jpg|js|png|txt|svg|woff|woff2|ttf|map|json|webp|webm)$)([^.]+$)/>
          Target: /index.html
          Status: '200'

  WebBranch:
    Type: AWS::Amplify::Branch
    Properties:
      AppId: !GetAtt WebApp.AppId
      BranchName: main
      Stage: PRODUCTION
      EnableAutoBuild: false

  # Shipped inside the frontend, so it is limited to map tiles and to the app's own addresses.
  MapsKey:
    Type: AWS::Location::APIKey
    Properties:
      KeyName: afterpass-maps
      Description: Basemap tiles for the AfterPass frontend
      NoExpiry: true
      Restrictions:
        AllowActions:
          - geo-maps:*
        AllowResources:
          - !Sub arn:aws:geo-maps:${AWS::Region}::provider/default
        AllowReferers:
          - !Sub https://main.${WebApp.DefaultDomain}/*
          - http://localhost:5173/*
          - http://127.0.0.1:5173/*
          - http://127.0.0.1:4173/*

  # --- Live pipeline (11.2-11.4) ----------------------------------------------------------

  # One role for the pipeline steps: the data bucket, the FIRMS key, the stats table, the
  # distribution's cache, the alert topic and their own logs.
  PipelineStepRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: pipeline
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub ${DataBucket.Arn}/*
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt DataBucket.Arn
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/afterpass/firms_map_key
              - Effect: Allow
                Action: [dynamodb:BatchWriteItem, dynamodb:PutItem]
                Resource: !GetAtt StatsTable.Arn
              - Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${DataDistribution}
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref AlertTopic

  FetchFirmsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Download the season's official fire detections
      PackageType: Image
      ImageUri: !Ref PipelineImage
      Architectures: [arm64]
      ImageConfig:
        Command: [pipeline.fetch_firms]
      MemorySize: 1024
      Timeout: 300
      Role: !GetAtt PipelineStepRole.Arn
      Environment:
        Variables: &pipeline-env
          DATA_BUCKET: !Ref DataBucket
          STATS_TABLE: !Ref StatsTable
          FIRMS_KEY_PARAMETER: /afterpass/firms_map_key
          DISTRIBUTION_ID: !Ref DataDistribution
          ALERT_TOPIC: !Ref AlertTopic
          WEB_URL: !Sub https://main.${WebApp.DefaultDomain}

  FetchFirmsLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${FetchFirmsFunction}
      RetentionInDays: 14

  FindScenesFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: List the Sentinel-2 dates each district needs
      PackageType: Image
      ImageUri: !Ref PipelineImage
      Architectures: [arm64]
      ImageConfig:
        Command: [pipeline.find_scenes]
      MemorySize: 1024
      Timeout: 120
      Role: !GetAtt PipelineStepRole.Arn
      Environment:
        Variables: *pipeline-env

  FindScenesLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${FindScenesFunction}
      RetentionInDays: 14

  DetectBurnsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Cache scenes, detect and match burn scars for one district
      PackageType: Image
      ImageUri: !Ref PipelineImage
      Architectures: [arm64]
      ImageConfig:
        Command: [pipeline.detect_burns]
      # The account's ceiling for one function; the brief asks for 8-10 GB.
      MemorySize: 3008
      Timeout: 900
      EphemeralStorage:
        Size: 4096
      Role: !GetAtt PipelineStepRole.Arn
      Environment:
        Variables: *pipeline-env

  DetectBurnsLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${DetectBurnsFunction}
      RetentionInDays: 14

  MatchAggregateFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Aggregate scars and publish the season's files
      PackageType: Image
      ImageUri: !Ref PipelineImage
      Architectures: [arm64]
      ImageConfig:
        Command: [pipeline.match_aggregate]
      MemorySize: 3008
      Timeout: 600
      Role: !GetAtt PipelineStepRole.Arn
      Environment:
        Variables: *pipeline-env

  MatchAggregateLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${MatchAggregateFunction}
      RetentionInDays: 14

  SmokeForecastFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: The 48-hour smoke forecast for Delhi
      PackageType: Image
      ImageUri: !Ref PipelineImage
      Architectures: [arm64]
      ImageConfig:
        Command: [pipeline.smoke_forecast]
      MemorySize: 3008
      Timeout: 600
      Role: !GetAtt PipelineStepRole.Arn
      Environment:
        Variables: *pipeline-env

  SmokeForecastLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${SmokeForecastFunction}
      RetentionInDays: 14

  RenderImageryFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Before and after crops for the season's top villages
      PackageType: Image
      ImageUri: !Ref PipelineImage
      Architectures: [arm64]
      ImageConfig:
        Command: [pipeline.render_imagery]
      MemorySize: 3008
      Timeout: 900
      # The before and after Sentinel-2 dates of up to 20 villages, pulled from the cache.
      EphemeralStorage:
        Size: 4096
      Role: !GetAtt PipelineStepRole.Arn
      Environment:
        Variables: *pipeline-env

  RenderImageryLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${RenderImageryFunction}
      RetentionInDays: 14

  PublishFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Refresh the published files at the edge
      PackageType: Image
      ImageUri: !Ref PipelineImage
      Architectures: [arm64]
      ImageConfig:
        Command: [pipeline.publish]
      MemorySize: 512
      Timeout: 60
      Role: !GetAtt PipelineStepRole.Arn
      Environment:
        Variables: *pipeline-env

  PublishLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${PublishFunction}
      RetentionInDays: 14

  PublishAlertsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Email subscribers when a Delhi zone reaches High
      PackageType: Image
      ImageUri: !Ref PipelineImage
      Architectures: [arm64]
      ImageConfig:
        Command: [pipeline.publish_alerts]
      MemorySize: 1024
      Timeout: 120
      Role: !GetAtt PipelineStepRole.Arn
      Environment:
        Variables: *pipeline-env

  PublishAlertsLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${PublishAlertsFunction}
      RetentionInDays: 14

  Pipeline:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: afterpass-pipeline
      Type: STANDARD
      DefinitionUri: statemachine/pipeline.asl.json
      DefinitionSubstitutions:
        FetchFirmsArn: !GetAtt FetchFirmsFunction.Arn
        FindScenesArn: !GetAtt FindScenesFunction.Arn
        DetectBurnsArn: !GetAtt DetectBurnsFunction.Arn
        MatchAggregateArn: !GetAtt MatchAggregateFunction.Arn
        SmokeForecastArn: !GetAtt SmokeForecastFunction.Arn
        RenderImageryArn: !GetAtt RenderImageryFunction.Arn
        PublishArn: !GetAtt PublishFunction.Arn
        PublishAlertsArn: !GetAtt PublishAlertsFunction.Arn
        FailureTopicArn: !Ref FailureTopic
      Policies:
        - LambdaInvokePolicy: {FunctionName: !Ref FetchFirmsFunction}
        - LambdaInvokePolicy: {FunctionName: !Ref FindScenesFunction}
        - LambdaInvokePolicy: {FunctionName: !Ref DetectBurnsFunction}
        - LambdaInvokePolicy: {FunctionName: !Ref MatchAggregateFunction}
        - LambdaInvokePolicy: {FunctionName: !Ref SmokeForecastFunction}
        - LambdaInvokePolicy: {FunctionName: !Ref RenderImageryFunction}
        - LambdaInvokePolicy: {FunctionName: !Ref PublishFunction}
        - LambdaInvokePolicy: {FunctionName: !Ref PublishAlertsFunction}
        - SNSPublishMessagePolicy: {TopicName: !GetAtt FailureTopic.TopicName}

  # Both schedules are created switched off (make schedule-on turns them on). Times are IST.
  ScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: start-pipeline
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: states:StartExecution
                Resource: !Ref Pipeline

  FullRunSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: afterpass-full-run
      Description: Daily full run at 19:12 IST, after FIRMS has processed the 13:30 pass
      ScheduleExpression: cron(12 19 * * ? *)
      ScheduleExpressionTimezone: Asia/Kolkata
      State: DISABLED
      FlexibleTimeWindow:
        Mode: 'OFF'
      Target:
        Arn: !Ref Pipeline
        RoleArn: !GetAtt ScheduleRole.Arn
        Input: '{"mode": "full"}'

  SmokeRefreshSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: afterpass-smoke-refresh
      Description: Smoke-only refresh at 07:12 IST
      ScheduleExpression: cron(12 7 * * ? *)
      ScheduleExpressionTimezone: Asia/Kolkata
      State: DISABLED
      FlexibleTimeWindow:
        Mode: 'OFF'
      Target:
        Arn: !Ref Pipeline
        RoleArn: !GetAtt ScheduleRole.Arn
        Input: '{"mode": "smoke"}'

  # --- Alerts (11.6) and operations (11.11) -----------------------------------------------

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: afterpass-delhi-smoke
      DisplayName: AfterPass smoke outlook

  FailureTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: afterpass-pipeline-failures
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail

  SubscribeFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      Description: Notify me - subscribes an email to one Delhi zone's smoke alerts
      CodeUri: ../backend
      Handler: subscribe.handler
      Runtime: python3.12
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 15
      Environment:
        Variables:
          ALERT_TOPIC: !Ref AlertTopic
          RATE_LIMIT_TABLE: !Ref RateLimitTable
          RATE_LIMIT_SALT: !Ref AWS::StackId
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - !Sub https://main.${WebApp.DefaultDomain}
            - http://localhost:5173
            - http://127.0.0.1:5173
            - http://127.0.0.1:4173
          AllowMethods: [POST]
          AllowHeaders: [content-type]
          MaxAge: 86400
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: sns:Subscribe
              Resource: !Ref AlertTopic
            - Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt RateLimitTable.Arn

  SubscribeLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${SubscribeFunction}
      RetentionInDays: 14

  PipelineFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: afterpass-pipeline-failed
      AlarmDescription: A run of the AfterPass pipeline failed
      Namespace: AWS/States
      MetricName: ExecutionsFailed
      Dimensions:
        - Name: StateMachineArn
          Value: !Ref Pipeline
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref FailureTopic

Outputs:
  SubscribeUrl:
    Description: The Notify-me endpoint (VITE_SUBSCRIBE_URL)
    Value: !GetAtt SubscribeFunctionUrl.FunctionUrl
  PipelineArn:
    Value: !Ref Pipeline
  WebUrl:
    Description: The public address of the app
    Value: !Sub https://main.${WebApp.DefaultDomain}
  WebAppId:
    Value: !GetAtt WebApp.AppId
  MapsKeyName:
    Value: !Ref MapsKey
  AgentUrl:
    Description: The agent's endpoint (VITE_AGENT_URL)
    Value: !GetAtt AgentFunctionUrl.FunctionUrl
  DataBucketName:
    Value: !Ref DataBucket
  DataUrl:
    Description: Base URL of the published data (VITE_DATA_BASE_URL)
    Value: !Sub https://${DataDistribution.DomainName}
  DistributionId:
    Value: !Ref DataDistribution
